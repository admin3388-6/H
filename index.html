<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maintenance — صيانة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}

  body{
    background:#000;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    font-family:'Press Start 2P', monospace;
    -webkit-font-smoothing:none;
  }

  /* ===== الخلفية: scanlines + vignette ===== */
  body::before{
    content:"";
    position:fixed;inset:0;z-index:9;pointer-events:none;
    background:radial-gradient(ellipse at center,
      transparent 35%,
      rgba(0,0,0,.85) 100%);
  }
  body::after{
    content:"";
    position:fixed;inset:0;z-index:10;pointer-events:none;
    background:repeating-linear-gradient(
      0deg,
      rgba(255,255,255,.035) 0px,
      rgba(255,255,255,.035) 1px,
      transparent 1px,
      transparent 3px
    );
    mix-blend-mode:overlay;
  }

  /* ===== المشهد ===== */
  .scene{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:44px;
    padding:24px;
    animation:fadeIn 1.4s ease-out both;
  }
  @keyframes fadeIn{
    from{opacity:0;transform:translateY(14px)}
    to{opacity:1;transform:none}
  }

  /* توهج خفيف خلف الرسم */
  .scene::before{
    content:"";
    position:absolute;
    width:min(90vw, 620px);
    aspect-ratio:1;
    border-radius:50%;
    background:radial-gradient(circle,
      rgba(255,255,255,.055) 0%,
      transparent 68%);
    z-index:-1;
    pointer-events:none;
  }

  /* ===== SVG ===== */
  svg#pixel-art{
    width:min(88vw, 480px);
    height:auto;
    display:block;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    shape-rendering:crispEdges;
  }

  /* ===== النص ===== */
  .label{
    font-family:'Press Start 2P', monospace;
    font-size:clamp(11px, 2.4vw, 18px);
    color:#fff;
    letter-spacing:.32em;
    text-indent:.32em;
    text-align:center;
    animation:labelFlicker 4.2s steps(1,end) infinite;
    user-select:none;
  }
  @keyframes labelFlicker{
    0%, 42%, 44%, 100%{opacity:1}
    43%{opacity:.15}
    78%{opacity:1}
    79%{opacity:.35}
    80%{opacity:1}
  }

  /* ===== مصابيح السيرفر ===== */
  .led{
    animation:ledBlink 1.5s infinite;
  }
  @keyframes ledBlink{
    0%, 45%{opacity:1}
    46%, 100%{opacity:.12}
  }

  /* ===== استجابة ===== */
  @media (max-width:480px){
    .scene{gap:32px}
    .label{letter-spacing:.24em;text-indent:.24em}
  }

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important}
  }
</style>
</head>
<body>

  <div class="scene" role="img" aria-label="صيانة السيرفر — Maintenance">
    <svg id="pixel-art" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="label">MAINTENANCE</div>
  </div>

<script>
/* ============================================================
   خريطة البكسل — 40 عمود × 32 صف
   #  = بكسل أبيض
   L  = بكسل أبيض وميض (LED)
   .  = فراغ (أسود)
   ============================================================ */
const MAP = [
  "........................................",
  "........................................",
  "........................................",
  "...####........####.....................",
  "...################.....................",
  "...################...........##########",
  "...################....##..##.#........#",
  "...###..######..###....##..##.#........#",
  "...#######..#######.....####..#.L.L.L..#",
  "...######....######......##...#........#",
  "...################......##...#........#",
  "....##############.......##...#.L.L.L..#",
  ".......########..........##...#........#",
  ".....############........##...#........#",
  "....##############.......##...#.L.L.L..#",
  "....##############.......##...#........#",
  "....#######################...#........#",
  "....#######################...#.L.L.L..#",
  "....#######################...#........#",
  "....##############.......##...#........#",
  "....##############.......##...#.L.L.L..#",
  "....##############.......##...#........#",
  ".....############........##...#........#",
  ".....####....####........##...#.L.L.L..#",
  ".....####....####........##...#........#",
  "....######..######.......##...##########",
  ".........................##.............",
  "........................................",
  "........................................",
  "........................................",
  "........................................",
  "........................................"
];

/* ============================================================
   الرسم
   ============================================================ */
(function render(){
  const PIXEL = 10;
  const COLS  = 40;
  const ROWS  = MAP.length;

  const svg = document.getElementById('pixel-art');
  svg.setAttribute('viewBox', `0 0 ${COLS * PIXEL} ${ROWS * PIXEL}`);
  svg.setAttribute('width',  COLS * PIXEL);
  svg.setAttribute('height', ROWS * PIXEL);

  const NS = 'http://www.w3.org/2000/svg';
  const frag = document.createDocumentFragment();

  MAP.forEach((row, y) => {
    for (let x = 0; x < row.length; x++) {
      const ch = row[x];
      if (ch !== '#' && ch !== 'L') continue;

      const rect = document.createElementNS(NS, 'rect');
      rect.setAttribute('x', x * PIXEL);
      rect.setAttribute('y', y * PIXEL);
      rect.setAttribute('width',  PIXEL);
      rect.setAttribute('height', PIXEL);
      rect.setAttribute('fill', '#ffffff');

      if (ch === 'L') {
        rect.setAttribute('class', 'led');
        // تأخير وميض مختلف لكل صف — تأثير مسح ضوئي
        rect.style.animationDelay = ((y * 0.18) % 1.5).toFixed(2) + 's';
      }

      frag.appendChild(rect);
    }
  });

  svg.appendChild(frag);
})();
</script>

</body>
</html>
